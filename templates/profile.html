{% extends "basechung.html" %}

{% block title %}Trang cá nhân{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-5">
        <div class="card shadow border-0 rounded-4 overflow-hidden">
            <div class="bg-primary bg-gradient" style="height: 140px;"></div>
            <div class="card-body p-4 p-md-5 text-center position-relative">
                <img src="https://ui-avatars.com/api/?name={{ user }}&background=ffffff&color=0d6efd&size=120&bold=true&rounded=true" 
                     class="position-absolute top-0 start-50 translate-middle border border-4 border-white rounded-circle shadow-sm" 
                     alt="Avatar">
                <div class="mt-5 pt-3">
                    <h2 class="fw-bold text-dark mb-0">@{{ user }}</h2>
                    <p class="text-muted fw-medium mt-1">Thành viên hệ thống</p>
                    
                    <div class="d-flex justify-content-center gap-3 mt-4 mb-4">
                        <span class="badge bg-light text-dark border px-3 py-2 rounded-pill fw-medium">
                            <i class="bi bi-circle-fill text-success me-1" style="font-size: 0.6rem;"></i> Đang hoạt động
                        </span>
                        <span class="badge bg-light text-dark border px-3 py-2 rounded-pill fw-medium">
                            <i class="bi bi-shield-check text-primary me-1"></i> Đã xác thực
                        </span>
                    </div>

                    <hr class="text-muted opacity-25">

                    <div class="mt-4">
                        <a href="{{ url_for('bai1') }}" class="btn btn-outline-primary fw-bold px-5 py-2 rounded-pill shadow-sm d-inline-flex align-items-center gap-2">
                            <i class="bi bi-house-door-fill"></i> Về Trang Chủ
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
