<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2. Tính điểm học phần</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center text-primary mb-4">Bài 2. Tính điểm học phần</h3>

                        <form method="POST" action="">
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">CC (10%)</label>
                                    <input type="text" name="cc" class="form-control {% if error_cc %}is-invalid{% endif %}" value="{{ cc }}">
                                    {% if error_cc %}
                                        <div class="invalid-feedback d-block">{{ error_cc }}</div>
                                    {% endif %}
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">GK (30%)</label>
                                    <input type="text" name="gk" class="form-control {% if error_gk %}is-invalid{% endif %}" value="{{ gk }}">
                                    {% if error_gk %}
                                        <div class="invalid-feedback d-block">{{ error_gk }}</div>
                                    {% endif %}
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">CK (60%)</label>
                                    <input type="text" name="ck" class="form-control {% if error_ck %}is-invalid{% endif %}" value="{{ ck }}">
                                    {% if error_ck %}
                                        <div class="invalid-feedback d-block">{{ error_ck }}</div>
                                    {% endif %}
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Tính điểm</button>
                        </form>

                        {% if result %}
                            <div class="alert alert-success mt-4 mb-0 text-center fw-bold fs-5" role="alert">
                                Kết quả: {{ result }}
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
