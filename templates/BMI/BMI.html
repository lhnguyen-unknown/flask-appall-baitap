<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3. Tính chỉ số BMI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center text-primary mb-4">Bài 3. Tính chỉ số BMI</h3>

                        <form method="POST" action="">
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Chiều cao (cm)</label>
                                    <input type="text" name="height" class="form-control {% if error_height %}is-invalid{% endif %}" value="{{ height }}">
                                    {% if error_height %}
                                        <div class="invalid-feedback d-block">{{ error_height }}</div>
                                    {% endif %}
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Cân nặng (kg)</label>
                                    <input type="text" name="weight" class="form-control {% if error_weight %}is-invalid{% endif %}" value="{{ weight }}">
                                    {% if error_weight %}
                                        <div class="invalid-feedback d-block">{{ error_weight }}</div>
                                    {% endif %}
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Tính BMI</button>
                        </form>

                        {% if result %}
                            <div class="alert {{ alert_class }} mt-4 mb-0 text-center fw-bold" role="alert">
                                Kết quả: {{ result }}
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
